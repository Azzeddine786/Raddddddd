  {id:2, t:"تاريخ الإذاعة المغربية: من البدايات إلى عصر البث الرقمي", c:"تاريخ", img:"https://images.unsplash.com/photo-1478737270239-2f02b77fc618?q=80&w=1200&auto=format&fit=crop", alt:"ميكروفون قديم", time:"15 دقيقة",
    body:`<p>يعود تاريخ الإذاعة في المغرب إلى بدايات القرن العشرين، حيث كانت الإذاعة وسيلة اتصال حديثة وغريبة على المجتمع المغربي. منذ ذلك الحين، مرت الإذاعة المغربية بتحولات كبيرة، من الاحتكار العام إلى التعددية، ومن الموجات القصيرة إلى البث الرقمي.</p>

    <p>تأسست أول محطة إذاعية في المغرب عام 1928، وكانت تسمى "راديو المغرب" (Radio Maroc). كانت تبث باللغتين الفرنسية والعربية، وتخدم الجالية الأوروبية في المقام الأول. بعد الاستقلال عام 1956، أصبحت الإذاعة أداة أساسية لبناء الدولة الوطنية.</p>

    <h3>التحديات المستقبلية</h3>

  {id:3, t:"كيف تختار الإذاعة المناسبة لسيارتك أو هاتفك في المغرب؟", c:"دليل", img:"https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?q=80&w=1200&auto=format&fit=crop", alt:"هاتف ذكي", time:"10 دقائق",
    body:`<p>في زحام الحياة اليومية، تلعب الإذاعة دوراً مهماً في الترفيه والمعلومات. لكن مع كثرة المحطات، قد يصعب عليك اختيار الإذاعة المناسبة. في هذا الدليل، نقدم لك نصائح عملية لاختيار الإذاعة المثالية لسيارتك أو هاتفك.</p>

// --- STATIONS & CATEGORIES ---
function renderCats() {
  $('pillRow').innerHTML = cats.map(c => `<button onclick="setCat('${c}')" class="chip ${activeCat === c ? 'active' : ''}">${c}</button>`).join('');
}
function setCat(c) { activeCat = c; renderCats(); renderStations(); }
function filtered() {
  let q = ($('mainSearch')?.value || '').toLowerCase().trim();
  return stations.filter(s => (activeCat === 'الكل' || s.cat === activeCat) && (!q || (s.name + ' ' + s.cat + ' ' + s.city + ' ' + s.lang + ' ' + s.desc).toLowerCase().includes(q)));
}
function renderStations() {
  renderCats();
  let list = filtered();
  const countEl = $('countTxt'); if (countEl) countEl.textContent = list.length;
  const emptyEl = $('emptyBox'); if (emptyEl) emptyEl.classList.toggle('hidden', list.length > 0);
  const gridEl = $('stationGrid');
  if (gridEl) {
    gridEl.innerHTML = list.map(s => `<article class="station">
       <div class="tile-top">
         <div class="station-logo"><img src="${s.logo}" alt="${s.name}" onerror="this.style.display='none';this.parentElement.textContent='${s.init}'"/></div>
         <button onclick="toggleFav(${s.id},event)" style="background:none; border:1px solid var(--line); border-radius:50%; width:32px; height:32px; display:grid; place-items:center; cursor:pointer; color:${favs.has(s.id) ? 'var(--red)' : '#a29a94'};">
           <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="${favs.has(s.id) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.65"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
         </button>
       </div>
       <h3>${s.name}</h3>
       <div class="station-meta"><span>${s.city}</span> • <span>${s.lang}</span></div>
       <div class="tile-foot">
         <button onclick="playStation(${s.id})" class="play-link">
           <span class="play-disc"><svg class="i" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
           ${currentId === s.id && isPlaying ? 'قيد التشغيل' : 'استمع'}
         </button>
         <span style="font-size:10px; color:#8d8982;">${s.cat}</span>
       </div>
     </article>`).join('');
  }
}
function toggleFav(id, e) { if (e) e.stopPropagation(); favs.has(id) ? favs.delete(id) : favs.add(id); saveFavs(); renderStations(); toast(favs.has(id) ? 'أضيف للمفضلة' : 'أزيل من المفضلة'); }
function renderArticles() {
  const el = $('articleGrid'); if (!el) return;
  el.innerHTML = articles.map(a => `<article class="station cursor-pointer" onclick="navigateTo('article', ${a.id})" style="padding:0; overflow:hidden;">
    <img src="${a.img}" alt="${a.alt}" style="width:100%; height:160px; object-fit:cover;"/>
    <div style="padding:16px;">
      <span style="font-size:10px; font-weight:800; background:#fbefea; color:var(--red); padding:4px 8px; border-radius:12px;">${a.c} • ${a.time}</span>
      <h3 style="font-size:18px; font-weight:800; margin-top:12px; line-height:1.4;">${a.t}</h3>
    </div>
  </article>`).join('');
}

// --- PLAYER ---
function playStation(id) {
  let s = stations.find(x => x.id === id); if (!s) return;
  if (currentId === id && !audio.paused) { togglePlay(); return; }
  currentId = id;
  const bar = $('playerBar'); bar.classList.add('open');
  $('pName').textContent = s.name;
  $('pStatus').textContent = 'جاري التحميل...';
  $('pDot').style.background = '#f39c7d';
  $('pLogo').innerHTML = `<img src="${s.logo}" alt="${s.name}" style="width:100%;height:100%;object-fit:contain;background:#fff;padding:2px;border-radius:10px;" onerror="this.style.display='none';this.parentElement.textContent='${s.init}'"/>`;
  $('playBtn').innerHTML = '<span style="display:inline-block; width:16px; height:16px; border:2px solid #49242a; border-top-color:transparent; border-radius:50%; animation:spin 0.7s linear infinite;"></span>';
  
  if (hls) { hls.destroy(); hls = null; }
  audio.pause(); audio.removeAttribute('src'); audio.load();
  
  if (s.stream.includes('.m3u8') && window.Hls && Hls.isSupported()) {
    hls = new Hls(); hls.loadSource(s.stream); hls.attachMedia(audio);
    hls.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(onAudioError));
    hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) onAudioError(); });
  } else {
    audio.src = s.stream;
    audio.play().catch(onAudioError);
  }
  renderStations();
}
function onAudioError() {
  $('pStatus').textContent = 'البث غير متوفر';
  $('pDot').style.background = '#444';
  $('playBtn').innerHTML = '<svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  isPlaying = false;
  toast('تعذر تشغيل هذا البث.');
}
function togglePlay() {
  if (!currentId) { playStation(1); return; }
  if (audio.paused) { audio.play().catch(onAudioError); }
  else { audio.pause(); }
}
function stopPlayer() {
  audio.pause(); if (hls) { hls.destroy(); hls = null; }
  audio.removeAttribute('src'); audio.load();
  currentId = null; isPlaying = false;
  $('playerBar').classList.remove('open');
  renderStations();
}
audio.addEventListener('playing', () => {
  isPlaying = true;
  $('pStatus').textContent = 'مباشر';
  $('pDot').style.background = '#4ade80';
  $('playBtn').innerHTML = '<svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  renderStations();
});
audio.addEventListener('pause', () => {
  isPlaying = false;
  if (currentId) $('pStatus').textContent = 'متوقف مؤقتاً';
  $('playBtn').innerHTML = '<svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  renderStations();
});
audio.addEventListener('error', () => { if (currentId) onAudioError(); });

// --- UTILS ---
function toggleLang() {
  const isAr = document.documentElement.lang === 'ar';
  document.documentElement.lang = isAr ? 'fr' : 'ar';
  document.documentElement.dir = isAr ? 'ltr' : 'rtl';
  document.querySelector('.lang').textContent = isAr ? 'AR' : 'FR';
  navigateTo('home');
  toast(isAr ? 'Mode Français activé' : 'تم تفعيل الوضع العربي');
}

// --- CLOCK ---
function updateClock() {
  const now = new Date();
  const opts = { timeZone: 'Africa/Casablanca', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
  $('clock').textContent = now.toLocaleTimeString('fr-FR', opts);
}
setInterval(updateClock, 1000);
updateClock();

// --- INIT ---
navigateTo('home');
setTimeout(() => { document.getElementById('promoBanner').classList.add('show'); }, 1500);
</script>
