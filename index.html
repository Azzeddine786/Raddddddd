  {id:1, t_ar:"أفضل 10 إذاعات مغربية للاستماع إليها في 2026", t_fr:"Top 10 des radios marocaines à écouter en 2026", cat_ar:"دليل", cat_fr:"Guide", img:"https://images.unsplash.com/photo-1590602847861-f357a9332bbc?q=80&w=800&auto=format&fit=crop", body_ar:`<p>في عام 2026، أصبح الاستماع إلى الراديو المغربي أسهل من أي وقت مضى. لكن مع كثرة المحطات، قد يصعب عليك اختيار الأفضل. في هذا الدليل، نستعرض أفضل 10 إذاعات مغربية.</p><h3>1. هيت راديو</h3><p>الوجهة الأولى لعشاق الموسيقى العصرية في المغرب. تقدم مزيجاً من البوب والراب والأغاني العالمية.</p><h3>2. راديو مارس</h3><p>إذا كنت من عشاق الرياضة، فراديو مارس هي محطتك المثالية. تغطي جميع مباريات البطولة المغربية.</p><h3>3. ميدي 1</h3><p>محطة إذاعية عريقة تأسست في طنجة، وتعتبر من أهم المحطات الإخبارية.</p><p>اختيار الإذاعة المثالية يعتمد على اهتماماتك. جرب عدة محطات، واكتشف الصوت الذي يرافقك في يومك.</p>`, body_fr:`<p>En 2026, écouter la radio marocaine est plus facile que jamais. Mais avec autant de stations, il peut être difficile de choisir la meilleure. Dans ce guide, nous vous présentons le top 10.</p><h3>1. Hit Radio</h3><p>La destination numéro un pour les amateurs de musique moderne au Maroc.</p><h3>2. Radio Mars</h3><p>Si vous êtes un passionné de sport, Radio Mars est votre station idéale.</p><p>Le choix de la radio idéale dépend de vos intérêts. Essayez plusieurs stations.</p>`},

  {id:3, t_ar:"كيف تختار الإذاعة المناسبة لسيارتك؟", t_fr:"Comment choisir la radio idéale pour votre voiture ?", cat_ar:"دليل", cat_fr:"Guide", img:"https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?q=80&w=800&auto=format&fit=crop", body_ar:`<p>في زحام الحياة اليومية، تلعب الإذاعة دوراً مهماً. لكن مع كثرة المحطات، قد يصعب عليك الاختيار.</p><h3>1. حدد اهتماماتك</h3><p>هل تريد الموسيقى؟ الأخبار؟ الرياضة؟ كل نوع له محطات متخصصة.</p><h3>2. جودة البث</h3><p>تأكد من جودة البث. بعض المحطات تبث بصيغة MP3، وأخرى بصيغة AAC أو HLS.</p><h3>3. التغطية الجغرافية</h3><p>إذا كنت في منطقة نائية، قد تواجه صعوبة في استقبال بعض المحطات.</p>`, body_fr:`<p>Dans la vie quotidienne, la radio joue un rôle important. Mais avec autant de stations, le choix peut être difficile.</p><h3>1. Définissez vos intérêts</h3><p>Voulez-vous de la musique ? Des nouvelles ? Du sport ?</p><h3>2. Qualité de diffusion</h3><p>Assurez-vous de la qualité de la diffusion.</p>`},
  {id:4, t_ar:"الإذاعات الجهوية المغربية: صوت كل منطقة", t_fr:"Radios régionales marocaines : la voix de chaque région", cat_ar:"جهوية", cat_fr:"Régionale", img:"https://images.unsplash.com/photo-1597212618440-806262de4f6b?q=80&w=800&auto=format&fit=crop", body_ar:`<p>في المغرب، تلعب الإذاعات الجهوية دوراً مهماً في تعزيز الهوية المحلية.</p><h3>1. كاب راديو (طنجة)</h3><p>تغطي منطقة شمال المغرب، وتعتبر صوت طنجة وتطوان.</p><h3>2. MFM (الدار البيضاء)</h3><p>تغطي عدة مدن مغربية، وتركز على الأخبار المحلية.</p><h3>3. راديو أزوان (الرباط)</h3><p>محطة أمازيغية تقدم برامج باللغة الأمازيغية.</p>`, body_fr:`<p>Au Maroc, les radios régionales jouent un rôle important dans la promotion de l'identité locale.</p><h3>1. Cap Radio (Tanger)</h3><p>Couvre le nord du Maroc, considérée comme la voix de Tanger et Tétouan.</p>`}

// --- STATE ---
let currentLang = 'ar';
let activeCat = 'all';
let currentId = null;
let hls = null;
let isPlaying = false;
const audio = new Audio(); audio.preload = "none";

// --- FUNCTIONS ---
function $(id) { return document.getElementById(id); }
function toast(m) { let t = $('toast'); t.textContent = m; t.style.opacity = 1; t.style.transform = 'translate(-50%, 0)'; setTimeout(() => { t.style.opacity = 0; t.style.transform = 'translate(-50%, 10px)'; }, 2500); }

function toggleLang() {
  currentLang = currentLang === 'ar' ? 'fr' : 'ar';
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  $('langBtn').textContent = currentLang === 'ar' ? 'FR' : 'AR';
  document.querySelectorAll('[data-ar]').forEach(el => {
    el.textContent = currentLang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-fr');
  });
  navigateTo('home');
  toast(currentLang === 'ar' ? 'تم تفعيل العربية' : 'Français activé');
}

function navigateTo(page, id = null) {
  window.scrollTo(0, 0);
  if (page === 'home') renderHome();
  else if (page === 'article') renderArticle(id);
  else renderStaticPage(page);
}

// --- HOME PAGE ---

    btn1: currentLang === 'ar' ? 'استمع الآن ▶' : 'Écouter maintenant ▶',

    search: currentLang === 'ar' ? 'ابحث عن محطة...' : 'Rechercher une station...',

    appBtn: currentLang === 'ar' ? 'تحميل' : 'Télécharger',

// --- RENDER STATIONS ---
function setCat(c) { activeCat = c; renderHome(); }
function renderStations() {
  const q = ($('searchInput')?.value || '').toLowerCase();
  const list = stations.filter(s => {
    const name = currentLang === 'ar' ? s.name_ar : s.name_fr;
    const cat = currentLang === 'ar' ? s.cat_ar : s.cat_fr;
    const matchQ = name.toLowerCase().includes(q) || cat.toLowerCase().includes(q);
    const matchCat = activeCat === 'all' || 
                     (activeCat === 'music' && (cat.includes('موسيقى') || cat.includes('Musique'))) ||
                     (activeCat === 'news' && (cat.includes('أخبار') || cat.includes('Actualité'))) ||
                     (activeCat === 'sport' && (cat.includes('رياضة') || cat.includes('Sport'))) ||
                     (activeCat === 'religious' && (cat.includes('دينية') || cat.includes('Religieux')));
    return matchQ && matchCat;
  });

  $('stationGrid').innerHTML = list.map(s => {
    const name = currentLang === 'ar' ? s.name_ar : s.name_fr;
    const cat = currentLang === 'ar' ? s.cat_ar : s.cat_fr;
    return `<div class="station">
      <div class="tile-top">
        <div class="station-logo"><img src="${s.logo}" alt="${name}" onerror="this.style.display='none';this.parentElement.textContent='${name[0]}'"/></div>
      </div>
      <h3>${name}</h3>
      <div class="station-meta">${s.city} • ${cat}</div>
      <button onclick="playStation(${s.id})" class="play-link">▶ ${currentLang === 'ar' ? 'استمع' : 'Écouter'}</button>
    </div>`;
  }).join('');
}

function renderArticles() {
  $('articleGrid').innerHTML = articles.map(a => {
    const title = currentLang === 'ar' ? a.t_ar : a.t_fr;
    const cat = currentLang === 'ar' ? a.cat_ar : a.cat_fr;
    return `<div class="article-card" onclick="navigateTo('article', ${a.id})">
      <img src="${a.img}" alt="${title}"/>
      <div>
        <span>${cat}</span>
        <h3>${title}</h3>
      </div>
    </div>`;
  }).join('');
}

function renderArticle(id) {
  const a = articles.find(x => x.id == id);
  if (!a) return navigateTo('home');
  const title = currentLang === 'ar' ? a.t_ar : a.t_fr;
  const body = currentLang === 'ar' ? a.body_ar : a.body_fr;
  $('app').innerHTML = `
    <div class="wrap page-content">
      <button onclick="navigateTo('home')" style="background:none;border:none;color:var(--red);font-weight:bold;cursor:pointer;margin-bottom:15px;">← ${currentLang === 'ar' ? 'رجوع' : 'Retour'}</button>
      <img src="${a.img}" style="width:100%;height:250px;object-fit:cover;border-radius:12px;margin-bottom:20px;"/>
      <h1>${title}</h1>
      <div>${body}</div>
    </div>`;
}

function renderStaticPage(key) {
  const content = currentLang === 'ar' ? pageContent[key].ar : pageContent[key].fr;
  $('app').innerHTML = `
    <div class="wrap page-content">
      <button onclick="navigateTo('home')" style="background:none;border:none;color:var(--red);font-weight:bold;cursor:pointer;margin-bottom:15px;">← ${currentLang === 'ar' ? 'رجوع' : 'Retour'}</button>
      ${content}
    </div>`;
}

// --- PLAYER ---
function playStation(id) {
  const s = stations.find(x => x.id === id); if (!s) return;
  if (currentId === id && !audio.paused) { togglePlay(); return; }
  
  currentId = id;
  const bar = $('playerBar'); bar.classList.add('open');
  const name = currentLang === 'ar' ? s.name_ar : s.name_fr;
  
  $('pName').textContent = name;
  $('pStatus').textContent = currentLang === 'ar' ? 'جاري التحميل...' : 'Chargement...';
  $('pLogo').innerHTML = `<img src="${s.logo}" onerror="this.style.display='none';this.parentElement.textContent='${name[0]}'"/>`;
  
  // Update Hero Radio Art
  if ($('heroStationName')) $('heroStationName').textContent = name;
  if ($('heroFreq')) $('heroFreq').textContent = (80 + Math.random() * 20).toFixed(1);

  if (hls) { hls.destroy(); hls = null; }
  audio.pause(); audio.removeAttribute('src'); audio.load();
  
  if (s.stream.includes('.m3u8') && window.Hls && Hls.isSupported()) {
    hls = new Hls(); hls.loadSource(s.stream); hls.attachMedia(audio);
    hls.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(onAudioError));
    hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) onAudioError(); });
  } else {
    audio.src = s.stream;
    audio.play().catch(onAudioError);
  }
}

function onAudioError() {
  $('pStatus').textContent = currentLang === 'ar' ? 'البث غير متوفر' : 'Flux indisponible';
  $('playBtn').textContent = '▶';
  isPlaying = false;
  toast(currentLang === 'ar' ? 'تعذر تشغيل هذا البث.' : 'Impossible de lire ce flux.');
}

function togglePlay() {
  if (!currentId) return playStation(1);
  if (audio.paused) audio.play().catch(onAudioError);
  else audio.pause();
}

function stopPlayer() {
  audio.pause(); if (hls) { hls.destroy(); hls = null; }
  audio.removeAttribute('src'); audio.load();
  currentId = null; isPlaying = false;
  $('playerBar').classList.remove('open');
  if ($('heroBar')) $('heroBar').style.width = '0%';
  if ($('heroStationName')) $('heroStationName').textContent = 'Radio Maroc';
}

// Audio Events
audio.addEventListener('playing', () => {
  isPlaying = true;
  $('pStatus').textContent = currentLang === 'ar' ? 'مباشر' : 'En direct';
  $('playBtn').textContent = '❚❚';
  if ($('heroBar')) $('heroBar').style.width = '70%';
});

audio.addEventListener('pause', () => {
  isPlaying = false;
  if (currentId) $('pStatus').textContent = currentLang === 'ar' ? 'متوقف' : 'En pause';
  $('playBtn').textContent = '▶';
  if ($('heroBar')) $('heroBar').style.width = '0%';
});

// Init
navigateTo('home');
</script>
</body>
</html>
