name: Unzip site
on:
  workflow_dispatch:
  push:
    paths: ['radiomaroc-github.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o radiomaroc-github.zip -x radiomaroc-github.zip
          rm radiomaroc-github.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deploy site" || exit 0
          git push
