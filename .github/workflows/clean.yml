name: Clean Website Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete old website files
        run: |
          git rm -r --ignore-unmatch -- . \
            ':(exclude)CNAME' \
            ':(exclude).nojekyll' \
            ':(exclude)_config.yml' \
            ':(exclude).github/**'

          if git diff --cached --quiet; then
            echo "Nothing to delete"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Clean old website files"
          git push
