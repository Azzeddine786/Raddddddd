name: Update Radio Maroc Domain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-domain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace old URLs everywhere
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          skip_ext = {".zip", ".png", ".jpg", ".jpeg", ".webp", ".gif", ".ico",
                      ".woff", ".woff2", ".ttf", ".mp3", ".mp4", ".pdf"}
          patterns = [
              (re.compile(r"https?://azzeddine786\.github\.io/Raddddddd/?", re.I), "https://radiomaroc.live/"),
              (re.compile(r"https?://radiomaroc\.live/Raddddddd/?", re.I), "https://radiomaroc.live/"),
              (re.compile(r"(?<![\w.])/Raddddddd/"), "/"),
          ]

          changed = 0
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if ".git" in path.parts or ".github" in path.parts:   # <-- الإصلاح
                  continue
              if path.name == "CNAME" or path.suffix.lower() in skip_ext:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              original = content
              for rx, new in patterns:
                  content = rx.sub(new, content)
              if content != original:
                  path.write_text(content, encoding="utf-8")
                  print("Updated:", path)
                  changed += 1
          print("Total updated files:", changed)
          PY

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update all website URLs to radiomaroc.live"
            git push origin main
          fi
