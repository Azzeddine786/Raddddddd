name: Unzip site
on:
  workflow_dispatch:
  push:
    paths: ['radiomaroc-github-2.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o radiomaroc-github-2.zip -x radiomaroc-github-2.zip
          rm radiomaroc-github-2.zip
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Deploy site" || exit 0
          git push
