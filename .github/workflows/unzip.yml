
name: Publish Radio Maroc

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy website files to root
        run: |
          set -e

          if [ ! -d "radiomaroc-site" ]; then
            echo "Website folder not found"
            exit 1
          fi

          # Copy all files, including hidden files
          cp -a radiomaroc-site/. .

          # Verify website entry point
          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html is missing"
            exit 1
          fi

          # Ensure GitHub Pages does not use Jekyll
          touch .nojekyll

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Publish Radio Maroc website to root"
            git push
          else
            echo "No changes to publish"
          fi
