name: Unzip Radio Maroc

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          # تم تصحيح هذا السطر بإزالة علامة التنصيص الزائدة
          ZIP_FILE="radiomaroc-site.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          # فك الضغط
          unzip -o "$ZIP_FILE" -d .
          
          # حذف الملف المضغوط بعد فك الضغط
          rm -f "$ZIP_FILE"

          # إعدادات Git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # إضافة التغييرات ورفعها
          git add -A
          git commit -m "Extract Radio Maroc website"
          git push
