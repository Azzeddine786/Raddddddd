name: Unzip site
on:
  workflow_dispatch:
  push:
    paths: ['radio-maroc-upload-phone (1).zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o radio-maroc-upload-phone (1).zip -x radio-maroc-upload-phone (1).zip
          rm radio-maroc-upload-phone (1).zip
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Deploy site" || exit 0
          git push
