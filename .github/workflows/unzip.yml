
name: Unzip and Publish Radio Maroc

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Extract website ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="radiomaroc-site.zip"
          EXTRACT_DIR="$RUNNER_TEMP/radiomaroc"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"

          unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "ZIP extracted successfully"

          # Find the website index.html
          if [ -f "$EXTRACT_DIR/index.html" ]; then
            SOURCE_DIR="$EXTRACT_DIR"
          else
            INDEX_FILE=$(find "$EXTRACT_DIR" -type f -name "index.html" -print -quit)

            if [ -z "$INDEX_FILE" ]; then
              echo "ERROR: index.html not found inside ZIP"
              exit 1
            fi

            SOURCE_DIR=$(dirname "$INDEX_FILE")
          fi

          echo "Website source: $SOURCE_DIR"

          # Copy website files to repository root
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$SOURCE_DIR/" ./

          # Verify website
          if [ ! -f "index.html" ]; then
            echo "ERROR: Website index.html missing"
            exit 1
          fi

          touch .nojekyll

          echo "Website is ready for publishing"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract and publish Radio Maroc website"
            git push origin HEAD
          else
            echo "No changes to publish"
          fi
