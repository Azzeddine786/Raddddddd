
name: Update Radio Maroc Domain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-domain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace old URLs everywhere
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")

          replacements = [
              (
                  "https://azzeddine786.github.io/Raddddddd",
                  "https://radiomaroc.live"
              ),
              (
                  "http://azzeddine786.github.io/Raddddddd",
                  "https://radiomaroc.live"
              ),
              (
                  "https://radiomaroc.live/Raddddddd/",
                  "https://radiomaroc.live/"
              ),
              (
                  "http://radiomaroc.live/Raddddddd/",
                  "https://radiomaroc.live/"
              ),
              (
                  "/Raddddddd/",
                  "/"
              )
          ]

          changed = 0

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if ".git" in path.parts:
                  continue

              if path.suffix.lower() in {
                  ".zip", ".png", ".jpg", ".jpeg",
                  ".webp", ".gif", ".ico", ".svg",
                  ".woff", ".woff2", ".ttf", ".mp3",
                  ".mp4", ".pdf"
              }:
                  continue

              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              original = content

              for old, new in replacements:
                  content = content.replace(old, new)

              if content != original:
                  path.write_text(content, encoding="utf-8")
                  print("Updated:", path)
                  changed += 1

          print("Total updated files:", changed)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes found"
            exit 0
          fi

          git commit -m "Update all website URLs to radiomaroc.live"
          git push
